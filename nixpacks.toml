# Railway/Nixpacks: deploy from repository ROOT (not backend/).
# One service serves the React app and Express API on the same URL.

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "cd backend && npm ci",
  "cd frontend && npm ci"
]

[phases.build]
cmds = ["cd backend && npm run build"]

[start]
cmd = "cd backend && npm start"
